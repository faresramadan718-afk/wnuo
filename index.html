<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ألعابي</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1220; color: #fff; padding: 2rem; text-align: center; }
    h1 { color: #a29bfe; margin-bottom: 2rem; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1000px; margin: auto; }
    .game-card { background: #1a1d33; border-radius: 12px; padding: 1.5rem; border: 1px solid #2d3154; transition: 0.3s; }
    .game-card:hover { transform: translateY(-5px); border-color: #6c5ce7; }
    .game-card h2 { color: #a29bfe; margin-bottom: 0.5rem; }
    .game-card p { color: #b0b0c0; margin-bottom: 1rem; font-size: 0.9rem; }
    .play-btn { background: #6c5ce7; color: white; text-decoration: none; padding: 0.6rem 1.5rem; border-radius: 8px; display: inline-block; font-weight: bold; }
    .play-btn:hover { background: #5849c9; }
  </style>
</head>
<body>

  <h1>🎮 ألعابي</h1>

  <div class="games-grid">
    
    <!-- ========================================== -->
    <!-- هنا هتحط لعبة جديدة. انسخ الجزء ده وعدل عليه -->
    <!-- ========================================== -->
    <div class="game-card">
      <h2>الغاز مرعبه</h2>
      <p>جواب على 30 سؤال مرعب</p>
      <!-- حط اللينك بتاع اللعبة اللي نسخته من جيت هاب هنا 👇 -->
      <a href="ضع_اللينك_هنا" target="_blank" class="play-btn">▶ العب الآن</a>
    </div>
    <!-- ========================================== -->

  </div>

</body>
</html>
